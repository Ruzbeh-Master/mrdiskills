    <path d="M384 196 C462 88 560 116 599 188 C625 235 611 282 579 315 C540 356 474 345 431 304 L362 242 C383 230 396 216 412 195 Z" fill="url(#greenStroke)"/>
    <path d="M395 214 C430 188 470 186 506 199 C541 212 568 239 583 272 C600 309 588 354 548 386 C507 418 451 410 418 379 C387 349 377 305 392 268 C399 251 399 236 395 214 Z" fill="none" stroke="#2f7a1f" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    <path d="M365 146 L403 185 L442 146 L403 106 Z" fill="url(#gold)"/>
    <path d="M400 111 L412 150 L451 164 L412 177 L400 216 L388 177 L349 164 L388 150 Z" fill="url(#gold)"/>
    <text x="400" y="448" text-anchor="middle" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="9">ARKA</text>
    <text x="400" y="482" text-anchor="middle" fill="#c9d7ef" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="2">SAE MINI BAJA</text>
