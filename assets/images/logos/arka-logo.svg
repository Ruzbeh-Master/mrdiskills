<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">ARKA Mini Baja logo</title>
  <desc id="desc">Abstract ARKA project mark for the SAE Mini Baja consultancy card.</desc>
  <defs>
    <linearGradient id="blueStroke" x1="180" y1="80" x2="420" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42d3ff"/>
      <stop offset="0.55" stop-color="#2e75c7"/>
      <stop offset="1" stop-color="#0f6b4e"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="320" y1="170" x2="590" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fb83d"/>
      <stop offset="0.55" stop-color="#4a9a31"/>
      <stop offset="1" stop-color="#2b6b21"/>
    </linearGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffef87"/>
      <stop offset="0.5" stop-color="#ffba2b"/>
      <stop offset="1" stop-color="#a95b00"/>
    </radialGradient>
  </defs>
  <g transform="translate(0 10)">
